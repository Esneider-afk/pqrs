<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''">
    <title th:text="${titulo} + ' · PQRSD'">PQRSD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar(activo)" class="navbar navbar-expand-lg navbar-dark navbar-pqrs sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-inbox-fill me-2"></i>PQRSD</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active'" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'radicar'} ? 'active'" th:href="@{/radicar}">Radicar solicitud</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'consulta'} ? 'active'" th:href="@{/consulta}">Consultar estado</a></li>
            </ul>
            <ul class="navbar-nav align-items-lg-center gap-lg-2">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:classappend="${activo == 'panel'} ? 'active'" th:href="@{/panel}">Panel</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:classappend="${activo == 'solicitudes'} ? 'active'" th:href="@{/panel/solicitudes}">Solicitudes</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-outline-light btn-sm" type="submit"><i class="bi bi-box-arrow-right"></i> Salir</button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/login}"><i class="bi bi-person-lock"></i> Funcionarios</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="site-footer mt-5">
    <div class="container d-flex flex-wrap justify-content-between">
        <span>Sistema PQRSD · Proyecto de grado · UTS</span>
        <span>Gestión y control de términos de respuesta</span>
    </div>
</footer>

<span th:fragment="semaforo(sem)" class="semaforo-badge" th:classappend="${sem.cssClass}">
    <span class="semaforo-dot"></span><th:block th:text="${sem.etiqueta}">En término</th:block>
</span>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
